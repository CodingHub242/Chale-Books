<div class="container">
  <h2>Receipt Builder</h2>
  <textarea [(ngModel)]="receipt.notes" placeholder="Notes / Client"></textarea>
  <div class="row">
    <input [(ngModel)]="newItem.description" placeholder="Description">
    <input type="number" [(ngModel)]="newItem.quantity" placeholder="Qty">
    <input type="number" [(ngModel)]="newItem.unit_price" placeholder="Unit price">
    <button (click)="addItem()">Add</button>
  </div>
  <div class="items">
    <div class="item" *ngFor="let it of receipt.items; let i=index">
      <span>{{it.description}} × {{it.quantity}} @ {{it.unit_price}}</span>
      <button class="secondary" (click)="removeItem(i)">Remove</button>
    </div>
  </div>
  <div class="actions">
    <button (click)="generate()">Generate PDF</button>
  </div>
</div>
